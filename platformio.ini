; PlatformIO project for the ESP32-S3 vibration-recorder firmware.
; See SELFTEST_SPEC.md for the board's hardware/pin specification.

[env:esp32-s3-selftest]
; Pinned to 6.7.0 (ESP-IDF 5.2.1) deliberately: the whole project is developed
; and tested against IDF 5.2.1. Leaving this unpinned let the platform silently
; auto-update to 6.13.0 (IDF 5.5.3), which both changes the toolchain under us
; and, in one case, arrived as a half-installed framework that broke the build.
; Pin it for reproducible builds; bump intentionally if/when upgrading.
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = espidf

; Dual-OTA layout (two app slots + otadata) so firmware can be updated over the
; air / via the dashboard's firmware-upload. Adopting this from the old single-
; app layout needs one USB flash; after that, updates are wireless. See
; partitions_ota.csv (nvs kept at the same offset, so settings survive).
board_build.partitions = partitions_ota.csv
board_build.flash_size = 8MB

; Additive post-build convenience: copies the finished firmware.bin to
; dist/vibrashock-v<version>.bin (the ready-to-upload OTA image). Does NOT change
; build or USB-upload behavior -- see pkg_firmware.py.
extra_scripts = post:pkg_firmware.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
